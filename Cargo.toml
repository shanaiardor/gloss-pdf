[workspace]
resolver = "2"
members = ["crates/ai-core", "crates/dict-core", "crates/pdf-core", "crates/gloss-pdf"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanaiardor/gloss-pdf"

[workspace.dependencies]
ai-core = { path = "crates/ai-core" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
image = "0.25"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"
env_logger = "0.11"
# rig 只允许出现在 ai-core 里：它迭代快、依赖重，隔离在一个 crate 才能控制重编范围。
# feature 取最小集（agent 运行时 + reqwest 传输 + rustls），向量库/图像/音频一律不编。
rig = { version = "=0.45.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "79fe6a645f68f8c9230578f154bf99852d9f716f", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "79fe6a645f68f8c9230578f154bf99852d9f716f", package = "gpui_platform" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
