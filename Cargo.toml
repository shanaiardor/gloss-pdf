[workspace]
resolver = "2"
members = ["crates/dict-core", "crates/pdf-core", "crates/gpui-pdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
image = "0.25"
unicode-segmentation = "1"
env_logger = "0.11"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "4bd1993783703e92affb781503916d1f152f599f", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4bd1993783703e92affb781503916d1f152f599f", package = "gpui_platform" }

[profile.release]
debug = true
