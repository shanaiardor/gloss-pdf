name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup PDFium
        run: bash scripts/setup-pdfium.sh
      - name: cargo test
        run: cargo test --locked --workspace

  build:
    name: Build macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup PDFium
        run: bash scripts/setup-pdfium.sh

      - name: Read version from Cargo.toml
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)
          if [ -z "$VERSION" ]; then
            echo "读不到 gloss-pdf 的版本号"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version = $VERSION"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "tag v$TAG 与 Cargo.toml 的 $VERSION 不一致"
              exit 1
            fi
          fi

      - name: Build macOS App & DMG
        run: bash installer/build-macos-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gloss-pdf-${{ env.APP_VERSION }}-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      # 只有打 tag 才发布；安装包上传到 release 资产
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
