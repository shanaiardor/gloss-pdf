name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # PR 上跑单测；打 tag 时跳过，优先保证发布速度。
  test:
    name: Test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked --workspace

  build:
    name: Build installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'gloss-pdf' }).version
          if (-not $version) { throw "读不到 gloss-pdf 的版本号" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "version = $version"

          # tag 必须和 Cargo.toml 一致，否则发布出来的安装包版本号会对不上。
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
            if ($tag -ne $version) {
              throw "tag v$tag 与 Cargo.toml 的 $version 不一致"
            }
          }

      - name: Build release binary
        run: cargo build --release --locked -p gloss-pdf

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAPP_VERSION=$env:APP_VERSION" "installer\gloss-pdf.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败（$LASTEXITCODE）" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gloss-pdf-${{ env.APP_VERSION }}-windows-x64
          path: dist/*setup.exe
          if-no-files-found: error

      # 只有打 tag 才发布；安装包上传到 release 资产，应用内更新就是读这里。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*setup.exe
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
