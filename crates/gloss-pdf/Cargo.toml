[package]
name = "gloss-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "笺释 (gloss-pdf) — A GPU-accelerated PDF reader with built-in dictionary lookup"

[dependencies]
pdf-core = { path = "../pdf-core" }
dict-core = { path = "../dict-core" }
ai-core.workspace = true

gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
image.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
unicode-segmentation.workspace = true
self_update = { version = "1.3", default-features = false, features = ["github", "ureq", "rustls"] }
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["runtime_shaders", "font-kit"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
